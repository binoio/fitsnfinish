name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    name: Core test suite (Linux container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build test image
        run: docker build -t fitsnfinish-tests .
      - name: Run tests
        run: docker run --rm fitsnfinish-tests
